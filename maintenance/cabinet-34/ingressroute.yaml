apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: funhouse-room-room3
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`riddler.nkplab.com`) && PathPrefix(`/r/1S2n9u71Nr4i`)
      kind: Rule
      services:
        - name: funhouse-room-room3
          port: 80
      middlewares:
        - name: funhouse-room-room3-strip
  # Use Traefik entrypoint / default cert store (TLS secret stays in app ns).
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: funhouse-room-room3-strip
spec:
  stripPrefix:
    prefixes:
      - /r/1S2n9u71Nr4i
